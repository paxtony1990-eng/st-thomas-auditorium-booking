p:70px}.section h2,.cta h2{font:500 38px/1.2 'Playfair Display',serif;color:#142f49;margin:18px 0}.section p{color:#687783;line-height:1.9;font-size:14px}.cards{background:#f6f7f7}.cards h2{text-align:center}.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}.card{padding:28px;background:white;border:1px solid #edf0f1}.card b{font:500 20px 'Playfair Display',serif;color:#17334e}.card p{font-size:12px}.note{background:#f8f5ef;padding:30px;border-left:3px solid #bd985c}.cta{background:#102b46;color:white;padding:52px 0}.cta .container{display:flex;justify-content:space-between;align-items:center}.cta h2{color:white}.cta p{font-size:13px;color:#c5d0d8}.footer{background:#0b2034;color:#d7e0e7;padding:45px 0}.footergrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:35px}.footer p{color:#aab8c3;font-size:12px;line-height:1.7}.footer h4{font-size:10px;letter-spacing:.16em;color:#d4b77f}.footbottom{border-top:1px solid #294056;margin-top:30px;padding-top:17px;font-size:10px;color:#8ea0ae;display:flex;justify-content:space-between}.modal{position:fixed;inset:0;background:#05131fcc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}.panel{background:white;width:min(680px,100%);max-height:95vh;overflow:auto;padding:34px;position:relative}.panel.wide{width:min(900px,100%)}.close{position:absolute;right:15px;top:15px;border:0;background:#f1f3f4;border-radius:50%;width:34px;height:34px}.panel h2{font:500 30px 'Playfair Display',serif;color:#142f49;margin:8px 0}.intro{font-size:12px;color:#72808a;line-height:1.7}.form{display:grid;gap:14px;margin-top:20px}.form label{font-size:11px;font-weight:700;color:#425363;display:grid;gap:6px}.form input,.form select,.form textarea{padding:12px;border:1px solid #dce2e5;font-size:12px;width:100%;color:#24394a}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{font-size:10px;line-height:1.5;background:#f8f5ef;padding:12px;color:#6e6556}.alert{padding:12px;background:#fff0ef;color:#a33c32;font-size:11px;line-height:1.5}.success{text-align:center;padding:20px}.ref{font-size:23px;letter-spacing:.1em;background:#f8f5ef;padding:18px;margin:20px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:20px 0}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button{border:0;padding:9px 12px;background:#f0f2f3;font-size:10px}.tabs button.active{background:#17334e;color:white}.booking{border:1px solid #e4e8ea;padding:16px;margin:10px 0}.bookingtop{display:flex;justify-content:space-between;gap:10px}.status{font-size:9px;text-transform:uppercase;padding:5px 8px;background:#f1f3f4}.status.pending{background:#fff4dc;color:#986c1d}.status.approved{background:#e9f5ec;color:#397748}.status.rejected,.status.cancelled{background:#fbeceb;color:#a14c43}.booking p{font-size:11px;color:#63717b;margin:8px 0}.smallbtn{border:0;padding:8px 12px;font-size:10px;margin-right:6px}.approve{background:#e8f3eb;color:#357447}.reject{background:#faecea;color:#a14c43}.empty{text-align:center;color:#71808a;padding:30px;font-size:12px}@media(max-width:700px){.nav a{display:none}.hero,.hero .container{min-height:550px}.two,.cardgrid,.footergrid{grid-template-columns:1fr;gap:20px}.section{padding:60px 0}.cta .container{display:block}.cta .btn{margin-top:10px}.row{grid-template-columns:1fr}.panel{padding:30px 20px}.meta{flex-direction:column;gap:8px}.actions{align-items:flex-start;flex-direction:column}.footbottom{flex-direction:column;gap:10px}}

<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const supabase=createClient('https://jnlesierxgzkcyrwhvcb.supabase.co','sb_publishable_GF63tNE81vLtYUGYpSrjTg_FEYic8JX');
const app=document.getElementById('app');
const isAdmin=location.pathname==='/admin';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ref=()=>'STH-'+crypto.randomUUID().replaceAll('-','').slice(0,8).toUpperCase();
function home(){app.innerHTML=`
<header class="header"><div class="container" style="display:flex;align-items:center;justify-content:space-between"><div class="brand"><span class="mark">✥</span><span><strong>ST. THOMAS</strong><small>C.S.I. CHURCH · NEDUNGADAPPALLY</small></span></div><nav class="nav"><a href="#about">The Auditorium</a><a href="#how">How it works</a><a href="#contact">Contact</a><button class="ghost" id="admin">◈ Admin</button><button class="btn" id="booktop">Request a booking →</button></nav></div></header>
<section class="hero"><div class="container"><div class="copy"><div class="eyebrow" style="color:#e4c58d">A PLACE FOR YOUR SPECIAL MOMENTS</div><h1>Gather. Celebrate.<br><em>Make memories.</em></h1><p>Enquire about hosting your special occasions at the auditorium of St. Thomas C.S.I. Church, Nedungadappally.</p><div class="actions"><button class="btn" id="bookhero">Check availability →</button><a href="#about">Discover the auditorium ↓</a></div><div class="meta"><span>⌖ Nedungadappally, Kerala</span><span>▦ Booking by request</span></div></div></div></section>
<section class="section" id="about"><div class="container two"><div><div class="eyebrow">THE AUDITORIUM</div><h2>A welcoming space<br>for meaningful occasions.</h2></div><div><p>From family celebrations to community gatherings, we invite you to enquire about using the church auditorium for your event.</p><p>Send us your preferred date and event details. Our parish team will review your request and contact you about availability, arrangements and applicable charges.</p><button class="ghost" id="bookinline">Make an enquiry →</button></div></div></section>
<section class="section cards" id="how"><div class="container"><div class="eyebrow" style="text-align:center">A SIMPLE PROCESS</div><h2>Plan your occasion with ease.</h2><div class="cardgrid"><article class="card"><b>1. Choose a date</b><p>Share your preferred event date and basic requirements through the online form.</p></article><article class="card"><b>2. We review your request</b><p>The parish booking team checks availability and reviews the details you provide.</p></article><article class="card"><b>3. Receive confirmation</b><p>Your booking is confirmed only after approval by the authorised parish administrator.</p></article></div></div></section>
<section class="section"><div class="container two"><div><div class="eyebrow">BEFORE YOU BOOK</div><h2>Clear communication.<br>Thoughtful planning.</h2><p>Please submit your request as early as possible. The parish office will confirm the date, charges, advance payment and venue arrangements directly with you.</p><button class="btn" id="booklower">Start a booking request →</button></div><div class="note"><b>Good to know</b><p>• Submitting a request does not reserve the date.</p><p>• Only approved bookings are treated as confirmed.</p><p>• Rates and payment instructions are provided by the parish office.</p><p>• Please wait for confirmation before making event arrangements.</p></div></div></section>
<section class="cta"><div class="container"><div><div class="eyebrow">YOUR OCCASION STARTS HERE</div><h2>Let’s plan your day.</h2><p>Send a booking enquiry to the parish team.</p></div><button class="btn alt" id="bookcta">Request a booking →</button></div></section>
<footer class="footer" id="contact"><div class="container"><div class="footergrid"><div><div class="brand" style="color:white"><span class="mark">✥</span><span><strong>ST. THOMAS</strong><small>C.S.I. CHURCH · NEDUNGADAPPALLY</small></span></div><p>A place for fellowship, community and meaningful moments.</p></div><div><h4>VISIT US</h4><p>Nedungadappally, Kerala, India<br>St. Thomas C.S.I. Church</p></div><div><h4>BOOKING ENQUIRIES</h4><p>For availability, rates and venue arrangements, submit a request or contact the parish office.</p><button class="ghost" id="bookfoot" style="color:#e0c28b">Send an enquiry →</button></div></div><div class="footbottom"><span>© 2026 St. Thomas C.S.I. Church, Nedungadappally</span><button class="ghost" id="adminfoot" style="color:#b6c3cc">Administrator access</button></div></div></footer>`;
['admin','adminfoot'].forEach(id=>document.getElementById(id).onclick=()=>location.href='/admin');
['booktop','bookhero','bookinline','booklower','bookcta','bookfoot'].forEach(id=>document.getElementById(id).onclick=bookingModal);
}
function showError(el,msg){el.innerHTML='<div class="alert">'+esc(msg)+'</div>'}
async function bookingModal(){const overlay=document.createElement('div');overlay.className='modal';overlay.innerHTML=`<section class="panel"><button class="close" aria-label="Close">×</button><div class="eyebrow">AUDITORIUM ENQUIRY</div><h2>Request a booking</h2><p class="intro">Share your event details. The parish office will check availability and get back to you.</p><div id="formerror"></div><form class="form" id="bookingform"><label>Event date *<input name="event_date" type="date" min="${new Date().toISOString().slice(0,10)}" required></label><label>Type of event *<select name="event_type" required><option value="">Select event type</option><option>Wedding reception</option><option>Engagement</option><option>Family gathering</option><option>Meeting or conference</option><option>Church or community programme</option><option>Other</option></select></label><div class="row"><label>Your name *<input name="contact_name" required maxlength="120"></label><label>Phone number *<input name="phone" type="tel" required maxlength="25" placeholder="+91"></label></div><div class="row"><label>Email (optional)<input name="email" type="email"></label><label>Expected guests *<input name="expected_guests" type="number" min="1" max="3000" value="100" required></label></div><label>Additional details<textarea name="notes" rows="3" maxlength="1000"></textarea></label><div class="notice">Your contact details are shared with the parish booking team only. Submitting this form does not confirm the booking.</div><button class="btn" type="submit">Submit booking request →</button></form></section>`;document.body.append(overlay);overlay.querySelector('.close').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.querySelector('form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,err=overlay.querySelector('#formerror'),data=Object.fromEntries(new FormData(form));data.expected_guests=Number(data.expected_guests);const booking_ref=ref();const {error}=await supabase.from('auditorium_bookings').insert({...data,booking_ref});if(error){showError(err,error.code==='23505'?'This date has just been booked. Please choose another date.':error.message);return}overlay.querySelector('.panel').innerHTML=`<div class="success"><div class="eyebrow">REQUEST SUBMITTED</div><h2>Thank you for your request.</h2><p class="intro">Your request has been received. The parish office will review it and contact you. Your date is not confirmed until the church approves it.</p><div class="ref">${booking_ref}</div><p class="intro">Please keep this booking reference.</p><button class="btn" onclick="this.closest('.modal').remove()">Done</button></div>`;};}
async function admin(){app.innerHTML=`<div class="container" style="padding:30px 0"><a href="/" style="color:#9b7134;text-decoration:none">← Visitor website</a><section class="panel" style="margin:35px auto;box-shadow:0 20px 70px #102b4618"><div class="eyebrow">PARISH ADMINISTRATION</div><h2>Booking administration</h2><p class="intro">Sign in with your authorised parish administrator account.</p><div id="adminerror"></div><form class="form" id="login"><label>Email address<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn">Sign in →</button></form><div id="dashboard"></div></section></div>`;const err=app.querySelector('#adminerror'),login=app.querySelector('#login'),dash=app.querySelector('#dashboard');login.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(login));const {data,error}=await supabase.auth.signInWithPassword(f);if(error)return showError(err,error.message);if(data.user.app_metadata?.role!=='admin'){await supabase.auth.signOut();return showError(err,'This account is not authorised as a parish administrator.')}login.remove();document.querySelector('.intro').textContent='Signed in to the parish booking dashboard.';dashboard();};async function dashboard(){let filter='pending';async function load(){const {data,error}=await supabase.from('auditorium_bookings').select('*').order('event_date',{ascending:true});if(error){showError(err,error.message);return}dash.innerHTML=`<div class="toolbar"><div class="tabs">${['pending','approved','rejected','cancelled','all'].map(x=>`<button data-filter="${x}" class="${x===filter?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><button class="ghost" id="logout">Sign out</button></div><div id="list"></div>`;dash.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};dash.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;load()});const rows=data.filter(x=>filter==='all'||x.status===filter);dash.querySelector('#list').innerHTML=rows.length?rows.map(r=>`<article class="booking"><div class="bookingtop"><b>${esc(r.event_type)}</b><span class="status ${esc(r.status)}">${esc(r.status)}</span></div><p>▦ ${esc(r.event_date)} · ${esc(r.expected_guests)} guests</p><p><b>${esc(r.contact_name)}</b> · ${esc(r.phone)}</p>${r.email?'<p>'+esc(r.email)+'</p>':''}${r.notes?'<p>'+esc(r.notes)+'</p>':''}<p>Reference: ${esc(r.booking_ref)}</p>${r.status==='pending'?'<button class="smallbtn approve" data-id="'+r.id+'" data-status="approved">Approve</button><button class="smallbtn reject" data-id="'+r.id+'" data-status="rejected">Reject</button>':''}${r.status==='approved'?'<button class="smallbtn reject" data-id="'+r.id+'" data-status="cancelled">Cancel booking</button>':''}</article>`).join(''):'<p class="empty">No booking requests in this category.</p>';dash.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const {error}=await supabase.from('auditorium_bookings').update({status:b.dataset.status,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);if(error)showError(err,error.message);else load()})}await load()}}
if(isAdmin)admin();else home();
</script>
</body></html>
